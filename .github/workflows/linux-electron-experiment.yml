name: linux electron experiment
on:
  push:
    branches: [experiment/linux-electron]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - run: node scripts/prepare-ripgrep.mjs
      # Bypass nx: its `build` target depends on the macOS-only workspace helper.
      - run: node apps/desktop/scripts/build.mjs
      # Report every failure: no max-failures, one retry-free pass.
      - run: xvfb-run -a bun run --cwd apps/desktop test:native -- --max-failures=0 --reporter=list,json
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-results
          path: apps/desktop/test-results
          if-no-files-found: ignore
