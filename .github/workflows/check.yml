name: checks
on:
  push:
    branches: [main]
  # A PR that changes only Markdown runs no checks.
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
# A PR runs the suites of the packages it changes and of the packages that depend on them; a push to
# main or a manual run runs every suite.
env:
  NX_RUN: ${{ github.event_name == 'pull_request' && format('affected --base=origin/{0} --head=HEAD', github.base_ref) || 'run-many' }}
  NX_PROJECTS: ${{ github.event_name == 'pull_request' && format('--affected --base=origin/{0} --head=HEAD', github.base_ref) || '' }}
# A PR's newer run cancels its older one. Every main push gets its own group, because GitHub cancels a pending
# run when another queues in the same group, which would skip that commit's checks.
concurrency:
  group: checks-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Tests that need macOS sit in each package's `test/macos/` (and all of `packages/workspace`); packages
# that have them carry the `macos-tests` Nx tag. The `macos` job runs those, the Linux jobs the rest.
# The account runs at most 5 macOS jobs at once and a merge and a PR push can run together, so a run
# uses two: `macos` and `electron`.
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check:foundation
      - run: node --test scripts/*.test.mjs
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run --cwd packages/workbench check:renderer

  # Ubuntu 24.04 ships OpenSSH 9.6; the `ssh` tests need 8.7 or newer.
  unit-linux:
    name: unit (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Two packages at a time on 4 cores, each running its files in two processes.
      MOONBASE_TEST_WORKERS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # `nx affected` compares with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # `CI` is set, so the chat-runtime ripgrep test fails rather than skips without it.
      - run: node scripts/prepare-ripgrep.mjs
      - run: echo "MOONBASE_TEST_RIPGREP=$PWD/dist/tools/ripgrep/rg" >> "$GITHUB_ENV"
      - run: bunx nx $NX_RUN -t test --exclude='tag:macos-tests' --parallel=2 --output-style=static
      - run: bunx nx $NX_RUN -t test:linux --parallel=2 --output-style=static

  integration-chat:
    name: integration (chat)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Two files at a time on 4 cores: each also runs a daemon and a forwarder.
      MOONBASE_TEST_WORKERS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:chat-integration

  # The workspace's native filesystem binary, the Keychain and the daemon's file host need macOS.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MOONBASE_TEST_WORKERS: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # `nx affected` compares with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: node scripts/prepare-ripgrep.mjs
      - run: echo "MOONBASE_TEST_RIPGREP=$PWD/dist/tools/ripgrep/rg" >> "$GITHUB_ENV"
      # The runner is ephemeral, so the chat-runtime suite may create and delete a temporary keychain.
      - run: bunx nx $NX_RUN -t test:macos --parallel=1 --output-style=static
        env:
          MOONBASE_TEST_KEYCHAIN: '1'
      - run: bun run test:editor-integration
      - run: bunx nx run @moonbase/desktop:build
      - run: node apps/desktop/scripts/check-renderer.mjs

  # The browser Playwright suites, on a demo with faux backends; the tests run the Mac keymap.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # `nx affected` compares with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - id: affected
        run: echo "projects=$(bunx nx show projects $NX_PROJECTS --with-target test:ui --with-target test:browser)" >> "$GITHUB_OUTPUT"
      - if: steps.affected.outputs.projects != '[]'
        run: bunx playwright install --with-deps --only-shell chromium
      - if: steps.affected.outputs.projects != '[]'
        run: bunx nx $NX_RUN -t test:ui test:browser --parallel=2 --output-style=static
      # Failures' traces, and every run's per-test timings (`timings.json`).
      - if: always() && steps.affected.outputs.projects != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: |
            packages/workbench/test-results
            apps/desktop/test-results/browser
          if-no-files-found: ignore

  # Real Electron from source, then the packaged app's tagged subset. The app's files need macOS.
  electron:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # `nx affected` compares with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - id: affected
        run: echo "projects=$(bunx nx show projects $NX_PROJECTS --with-target test:native)" >> "$GITHUB_OUTPUT"
      - if: steps.affected.outputs.projects != '[]'
        run: node scripts/prepare-ripgrep.mjs
      - if: steps.affected.outputs.projects != '[]'
        run: bunx nx run @moonbase/desktop:build
      - if: steps.affected.outputs.projects != '[]'
        run: bun run --cwd apps/desktop test:native
      # Packaging bundles the pinned Bun that runs the daemon.
      - if: steps.affected.outputs.projects != '[]'
        run: node scripts/prepare-bun.mjs
      - if: steps.affected.outputs.projects != '[]'
        run: bunx nx run @moonbase/desktop:package
      - if: steps.affected.outputs.projects != '[]'
        run: bun run --cwd apps/desktop check:package
      - if: steps.affected.outputs.projects != '[]'
        run: bun run --cwd apps/desktop test:package
      # Failures' traces, and the timings of each run (`native/` and `package/`).
      - if: always() && steps.affected.outputs.projects != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-results
          path: apps/desktop/test-results
          if-no-files-found: ignore
