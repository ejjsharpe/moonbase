name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  modules:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:foundation
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
