name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A PR's newer run cancels its older one. Every main push gets its own group, because GitHub cancels a pending
# run when another queues in the same group, which would skip that commit's checks.
concurrency:
  group: checks-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:foundation
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run --cwd packages/contracts check:socket-schema
      - run: bun run --cwd packages/workbench check:renderer

  # The workspace's native filesystem binary, which the desktop build and tests use, and the pinned ripgrep need macOS.
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: node scripts/prepare-ripgrep.mjs
      - run: echo "MOONBASE_TEST_RIPGREP=$PWD/dist/tools/ripgrep/rg" >> "$GITHUB_ENV"
      # The runner is ephemeral, so the pi-runtime suite may create and delete a temporary keychain.
      - run: bun run test
        env:
          MOONBASE_TEST_KEYCHAIN: '1'
      - run: bun run test:editor-integration
      - run: bun run test:chat-integration
      - run: bunx nx run @moonbase/desktop:build
      - run: node apps/desktop/scripts/check-renderer.mjs
