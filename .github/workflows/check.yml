name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  modules:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:foundation
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: node scripts/prepare-ripgrep.mjs
      - run: echo "MOONBASE_TEST_RIPGREP=$PWD/dist/tools/ripgrep/rg" >> "$GITHUB_ENV"
      - run: bun run test
      - run: bun run test:editor-integration
      - run: bun run test:chat-integration
      - run: bunx nx run @moonbase/desktop:build
      - run: node apps/desktop/scripts/check-renderer.mjs
      - run: bun run --cwd packages/editor check:renderer
      - run: bunx playwright install chromium
      - run: bun run --cwd packages/editor test:ui
