name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:foundation
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run --cwd packages/workbench check:renderer

  # The workspace's native filesystem binary, which the desktop build and tests use, and the pinned ripgrep need macOS.
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: node scripts/prepare-ripgrep.mjs
      - run: echo "MOONBASE_TEST_RIPGREP=$PWD/dist/tools/ripgrep/rg" >> "$GITHUB_ENV"
      - run: bun run test
      - run: bun run test:editor-integration
      - run: bun run test:chat-integration
      - run: bunx nx run @moonbase/desktop:build
      - run: node apps/desktop/scripts/check-renderer.mjs

  # Slow and flaky on PRs: run on main and on demand (Actions > checks > Run workflow).
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: workbench, cwd: packages/workbench, script: test:ui }
          - { name: desktop, cwd: apps/desktop, script: test:browser }
    name: browser (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd ${{ matrix.suite.cwd }} ${{ matrix.suite.script }}
